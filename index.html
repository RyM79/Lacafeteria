<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pastelería Nube de Azúcar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azucar:#FFF4E6;
  --fresa:#FFB3C9;
  --fresa-fuerte:#F2678F;
  --menta:#93E0C4;
  --arandano:#BDB2F2;
  --mantequilla:#FFDD8F;
  --madera:#E8BE94;
  --madera-osc:#C99568;
  --tinta:#5A3E4C;
  --sombra:rgba(90,62,76,.18);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;
  color:var(--tinta);
  background:
    radial-gradient(circle at 12% 18%, #fff 0 7px, transparent 8px) 0 0/64px 64px,
    radial-gradient(circle at 62% 68%, #fff 0 5px, transparent 6px) 0 0/64px 64px,
    linear-gradient(180deg,#FFE9F0 0%, var(--azucar) 55%, #FFF0DC 100%);
  background-attachment:fixed;
  user-select:none;touch-action:manipulation;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ---------- estructura ---------- */
#app{max-width:940px;margin:0 auto;padding:10px 12px 26px;position:relative}
.screen{display:none;animation:aparece .35s ease both}
.screen.on{display:block}
@keyframes aparece{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- barra superior ---------- */
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;
  background:#fff;border:4px solid #fff;border-radius:20px;padding:6px 10px;
  box-shadow:0 6px 0 var(--sombra);margin-bottom:12px}
.marcadores{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;
  background:var(--azucar);border-radius:999px;padding:5px 14px;line-height:1.1}
.chip.dia{background:var(--arandano);color:#3E2F5B}
.chip.oro{background:var(--mantequilla)}
.chip.estrella{background:var(--fresa)}
.btn-mus{width:48px;height:48px;border-radius:50%;background:var(--menta);
  font-size:23px;box-shadow:0 4px 0 #6BC5A5;display:grid;place-items:center}
.btn-mus:active{transform:translateY(3px);box-shadow:0 1px 0 #6BC5A5}
.btn-mus.off{background:#E6DCE2;box-shadow:0 4px 0 #C8B9C3;opacity:.75}

/* ---------- portada ---------- */
.portada{text-align:center;padding:6px 0 20px}
.toldo{height:46px;border-radius:0 0 16px 16px;
  background:repeating-linear-gradient(90deg,var(--fresa) 0 40px,#fff 40px 80px);
  box-shadow:0 6px 0 var(--sombra);margin-bottom:16px}
h1{font-size:clamp(34px,9vw,60px);line-height:.98;margin:6px 0 2px;
  color:#fff;text-shadow:3px 3px 0 var(--fresa-fuerte),6px 7px 0 var(--sombra)}
.sub{font-size:19px;font-weight:700;color:#9A7186;margin:0 0 14px}
.cartel{background:#fff;border-radius:var(--r);padding:16px 14px;box-shadow:0 7px 0 var(--sombra);
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.paso{width:150px}
.paso .ico{font-size:40px}
.paso p{margin:2px 0 0;font-size:16px;font-weight:700;line-height:1.15}
.paso b{display:block;font-size:14px;color:var(--fresa-fuerte)}
.btn-grande{background:var(--fresa-fuerte);color:#fff;font-size:32px;font-weight:800;
  padding:16px 44px;border-radius:999px;box-shadow:0 8px 0 #C34C71;letter-spacing:.5px}
.btn-grande:active{transform:translateY(4px);box-shadow:0 4px 0 #C34C71}
.mascota{font-size:64px;display:block;animation:bota 1.6s ease-in-out infinite}
@keyframes bota{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

/* ---------- zona de juego ---------- */
.tablero{display:flex;flex-direction:column;gap:12px}
@media(min-width:830px){.tablero{flex-direction:row;align-items:flex-start}
  .col-cliente{width:330px;flex:none}.col-taller{flex:1}}

.tarjeta{background:#fff;border-radius:var(--r);box-shadow:0 7px 0 var(--sombra);padding:12px}
.titulo{font-size:17px;font-weight:800;color:#A97F94;margin:0 0 8px;text-align:center;
  text-transform:uppercase;letter-spacing:1px}

/* cliente */
.escena{position:relative;background:linear-gradient(180deg,#FDE7F0,#FFF6EC 70%);
  border-radius:18px;padding:10px 10px 0;overflow:hidden}
.escena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
  background:var(--madera);border-top:5px solid var(--madera-osc)}
.fila-cliente{display:flex;align-items:flex-end;gap:6px;position:relative;z-index:2;padding-bottom:26px}
.cliente{width:118px;flex:none;animation:entra .5s cubic-bezier(.3,1.4,.5,1) both}
.cliente.idle{animation:flota 2.4s ease-in-out infinite}
@keyframes entra{from{transform:translateX(-120px) scale(.7);opacity:0}}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.globo{position:relative;background:#fff;border-radius:18px;padding:8px 10px 6px;
  box-shadow:0 5px 0 var(--sombra);flex:1;text-align:center}
.globo::before{content:"";position:absolute;left:-11px;bottom:20px;width:0;height:0;
  border:11px solid transparent;border-right-color:#fff}
.globo .quiero{font-size:14px;font-weight:800;color:#A97F94;margin:0 0 2px}
.precio-cartel{margin-top:6px;font-size:17px;font-weight:800;background:var(--mantequilla);
  border-radius:999px;padding:2px 10px;display:inline-block}

/* pestañas de estación */
.estaciones{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.est{flex:1 1 84px;background:var(--azucar);border-radius:16px;padding:8px 4px;text-align:center;
  font-size:14px;font-weight:800;box-shadow:0 4px 0 #E7D6C6;transition:.15s}
.est .e{display:block;font-size:30px;line-height:1.1}
.est.sel{background:var(--menta);box-shadow:0 4px 0 #6BC5A5;transform:translateY(-2px)}
.est:active{transform:translateY(2px)}

/* mesa de trabajo */
.mesa{display:flex;gap:12px;align-items:center;flex-direction:column}
@media(min-width:520px){.mesa{flex-direction:row;align-items:flex-start}
 .mesa .lienzo{flex:none}.mesa .controles{flex:1;width:100%}}
.lienzo{background:linear-gradient(180deg,#FFF9F0,#FFEFE1);border-radius:18px;
  padding:6px;box-shadow:inset 0 -6px 0 rgba(201,149,104,.25);position:relative}
.grupo{margin-bottom:10px}
.grupo h4{margin:0 0 5px;font-size:15px;font-weight:800;color:#A97F94;letter-spacing:.5px}
.ops{display:flex;gap:7px;flex-wrap:wrap}
.op{width:54px;height:54px;border-radius:16px;box-shadow:0 4px 0 rgba(90,62,76,.22);
  display:grid;place-items:center;font-size:26px;position:relative;transition:.12s;background:#fff}
.op:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,62,76,.22)}
.op.sel{outline:4px solid var(--fresa-fuerte);outline-offset:2px;transform:translateY(-3px)}
.op .nom{position:absolute;bottom:-3px;font-size:10px;font-weight:800;color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.35)}
.acciones{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;background:var(--fresa-fuerte);color:#fff;font-size:24px;font-weight:800;
  padding:12px 10px;border-radius:18px;box-shadow:0 6px 0 #C34C71}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #C34C71}
.btn.sec{background:var(--arandano);box-shadow:0 6px 0 #8F82C9;color:#382B57}
.btn.sec:active{box-shadow:0 3px 0 #8F82C9}
.btn[disabled]{background:#E6DCE2;color:#B0A0AA;box-shadow:0 6px 0 #CDBDC7;pointer-events:none}
.batidora{background:var(--arandano);box-shadow:0 6px 0 #8F82C9;color:#382B57}
.batiendo{animation:tiembla .18s linear infinite}
@keyframes tiembla{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-2deg)}75%{transform:translate(3px,-1px) rotate(2deg)}}

/* ---------- dibujo de los productos ---------- */
.caja{position:relative;overflow:hidden}
.caja.lg{width:240px;height:220px}
.caja.sm{width:120px;height:110px}
.caja.xs{width:96px;height:88px}
.escenario{position:absolute;left:0;top:0;width:240px;height:220px;transform-origin:0 0}
.caja.sm .escenario{transform:scale(.5)}
.caja.xs .escenario{transform:scale(.4)}
.plato{position:absolute;left:22px;bottom:10px;width:196px;height:24px;border-radius:50%;
  background:#F6E7DA;box-shadow:0 4px 0 #E0CBBA}
.bizcocho{position:absolute;left:46px;bottom:24px;width:148px;height:88px;border-radius:12px 12px 16px 16px}
.crema{position:absolute;left:38px;bottom:104px;width:164px;height:46px;
  border-radius:50% 50% 12px 12px/62% 62% 12px 12px}
.gota{position:absolute;width:22px;height:22px;border-radius:50%;bottom:-9px}
.top{position:absolute;font-size:26px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.vela{position:absolute;left:116px;bottom:146px;width:8px;height:26px;border-radius:4px;
  background:repeating-linear-gradient(45deg,#fff 0 5px,var(--fresa) 5px 10px)}
.llama{position:absolute;left:114px;bottom:170px;width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#FFD86B,#FF9A3C);animation:fuego .5s ease-in-out infinite alternate}
@keyframes fuego{to{transform:scale(1.15) translateY(-2px)}}

.vaso{position:absolute;left:70px;bottom:22px;width:100px;height:132px;
  clip-path:polygon(10% 0,90% 0,76% 100%,24% 100%);background:rgba(255,255,255,.7)}
.liquido{position:absolute;left:0;bottom:0;width:100%;height:80%}
.brillo{position:absolute;left:14px;top:10px;width:12px;height:80px;border-radius:8px;
  background:rgba(255,255,255,.6);transform:rotate(6deg)}
.trozo{position:absolute;width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.55)}
.nata{position:absolute;border-radius:50%}
.pajita{position:absolute;left:120px;bottom:120px;width:12px;height:74px;border-radius:6px;
  transform:rotate(16deg);background:repeating-linear-gradient(140deg,#fff 0 8px,var(--fresa-fuerte) 8px 16px)}
.base-vaso{position:absolute;left:72px;bottom:14px;width:96px;height:16px;border-radius:50%;background:#EFE0D2}
.galleta-svg{position:absolute;left:35px;bottom:26px}
.chispa{position:absolute;width:9px;height:5px;border-radius:3px}

.etiqueta{display:inline-block;background:var(--menta);border-radius:999px;padding:2px 12px;
  font-size:14px;font-weight:800;margin-bottom:4px}
.est.bloq{opacity:.5;filter:grayscale(.7);box-shadow:0 4px 0 #DCD0D8;pointer-events:none}
.est small{display:block;font-size:11px;font-weight:700}
.medidor{height:20px;border-radius:999px;background:#F1E4D6;overflow:hidden;margin-bottom:6px;
  box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.medidor .relleno{height:100%;background:var(--menta);transition:width .08s linear}
.medidor.tiempo .relleno{background:var(--fresa-fuerte)}
.atajo{font-size:15px;font-weight:700;color:#9A7186;margin:14px 0 0}
.atajo button{background:#fff;border-radius:999px;padding:6px 16px;font-weight:800;
  color:var(--fresa-fuerte);box-shadow:0 4px 0 var(--sombra);font-size:15px}
.contador{font-size:30px;font-weight:800;margin:6px 0}
.moneda.dos{width:68px;height:68px;
  background:radial-gradient(circle at 35% 30%,#FFF3D0,#E8B45C);box-shadow:0 5px 0 #C08A2E}
.moneda{position:relative;font-weight:800;color:#8A5A20}

/* ---------- zumo ---------- */
.vaso-alto{position:absolute;left:76px;bottom:26px;width:88px;height:140px;overflow:hidden;
  border-radius:10px 10px 22px 22px;background:rgba(255,255,255,.75)}
.liq-zumo{position:absolute;left:0;bottom:0;width:100%;transition:height .1s}
.hielo{position:absolute;width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.65)}
.rodaja{position:absolute;font-size:30px}

/* ---------- hamburguesa ---------- */
.pan{position:absolute;left:42px;background:linear-gradient(180deg,#F5C07A,#E09A4E)}
.pan-abajo{bottom:26px;width:156px;height:26px;border-radius:8px 8px 22px 22px}
.pan-arriba{width:156px;height:44px;border-radius:50% 50% 10px 10px/70% 70% 10px 10px}
.sesamo{position:absolute;width:11px;height:7px;border-radius:50%;background:#FFF0D2}
.capa{position:absolute;left:42px}
.rebanada{position:absolute;border-radius:50%}
.pista{margin:6px 0 0;font-size:14px;font-weight:700;color:#A97F94;text-align:center}
.torre-vacia{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:15px;
  font-weight:800;color:#C0A7B4}

/* ---------- café ---------- */
.platillo{position:absolute;left:44px;bottom:22px;width:152px;height:24px;border-radius:50%;
  background:#F6E7DA;box-shadow:0 4px 0 #E0CBBA}
.asa{position:absolute;left:168px;bottom:74px;width:44px;height:48px;border-radius:50%;
  border:12px solid #fff;box-sizing:border-box}
.taza{position:absolute;left:62px;bottom:34px;width:116px;height:116px;overflow:hidden;
  border-radius:12px 12px 44px 44px;background:#fff;box-shadow:inset -10px 0 0 rgba(90,62,76,.07)}
.liq-cafe{position:absolute;left:0;bottom:0;width:100%;transition:height .06s linear}
.chorro{position:absolute;left:112px;bottom:150px;width:10px;height:56px;border-radius:6px;
  background:linear-gradient(180deg,rgba(107,64,40,0),#6B4028);animation:cae-chorro .3s linear infinite}
@keyframes cae-chorro{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.espuma{position:absolute;left:2px;right:2px;top:-9px;height:20px;border-radius:50%;background:#FFF8EE}
.linea-obj{position:absolute;left:0;right:0;height:0;border-top:4px dashed var(--fresa-fuerte);opacity:.85}
.flecha-obj{position:absolute;left:24px;font-size:22px;animation:senala 1.2s ease-in-out infinite}
@keyframes senala{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}

/* ---------- gofre ---------- */
.gofre{position:absolute;left:56px;bottom:34px;width:128px;height:110px;border-radius:16px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.rejilla{position:absolute;inset:0;border-radius:16px;
  background-image:linear-gradient(90deg,rgba(90,50,20,.22) 3px,transparent 3px),
                   linear-gradient(rgba(90,50,20,.22) 3px,transparent 3px);
  background-size:26px 26px;background-position:9px 9px}
.sirope{position:absolute;left:58px;bottom:112px;width:124px;height:32px;
  border-radius:50% 50% 10px 10px/60% 60% 10px 10px}
.plancha{position:relative;height:36px;border-radius:999px;overflow:hidden;margin:2px 0 8px;
  background:linear-gradient(90deg,#F7E7C6 0 35%,#E8B45C 35% 65%,#7A5230 65% 100%);
  box-shadow:inset 0 4px 0 rgba(0,0,0,.14)}
.plancha b{position:absolute;top:6px;font-size:13px;color:#7A5230;font-weight:800}
.marca{position:absolute;top:0;width:12px;height:100%;background:#fff;border-radius:8px;
  box-shadow:0 0 0 3px rgba(90,62,76,.4)}

/* ---------- aviso ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--tinta);color:#fff;font-weight:800;font-size:17px;padding:10px 20px;
  border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:70}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- reacción ---------- */
.velo{position:fixed;inset:0;background:rgba(90,62,76,.42);display:none;place-items:center;
  z-index:50;padding:16px;backdrop-filter:blur(2px)}
.velo.on{display:grid}
.panel{background:#fff;border-radius:26px;padding:18px 16px;text-align:center;max-width:400px;width:100%;
  box-shadow:0 10px 0 rgba(0,0,0,.2);animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
.panel h2{margin:6px 0 4px;font-size:30px;line-height:1.05}
.panel p{margin:0 0 10px;font-size:18px;font-weight:700;color:#9A7186}
.estrellas{font-size:44px;letter-spacing:6px;height:52px}
.estrellas span{display:inline-block;animation:brota .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes brota{from{transform:scale(0) rotate(-90deg)}}
.apagada{filter:grayscale(1);opacity:.3}

/* ---------- caja registradora ---------- */
.caja-reg{text-align:center}
.huecos{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
.hueco{width:46px;height:46px;border-radius:50%;background:#F3E6DA;
  box-shadow:inset 0 3px 0 #E0CDBC;display:grid;place-items:center;font-size:24px}
.hueco.lleno{background:var(--mantequilla);box-shadow:0 3px 0 #D9A83F;animation:brota .3s both}
.monton{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.moneda{width:56px;height:56px;border-radius:50%;font-size:28px;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFEFA8,var(--mantequilla));box-shadow:0 5px 0 #D9A83F}
.moneda:active{transform:translateY(3px);box-shadow:0 2px 0 #D9A83F}
.moneda.ida{animation:vuela .45s ease-in forwards;pointer-events:none}
@keyframes vuela{to{transform:translateY(-130px) scale(.4) rotate(180deg);opacity:0}}
.no{animation:niega .3s}
@keyframes niega{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* confeti */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf{position:absolute;width:12px;height:16px;border-radius:3px;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ PORTADA ============ -->
  <section id="s-inicio" class="screen on">
    <div class="portada">
      <div class="toldo"></div>
      <span class="mascota">🧁</span>
      <h1>Pastelería<br>Nube de Azúcar</h1>
      <p class="sub">Prepara, decora y cobra · cada día abre un puesto nuevo</p>
      <div class="cartel">
        <div class="paso"><div class="ico">🐻</div><p><b>1. Mira</b>El cliente enseña lo que quiere</p></div>
        <div class="paso"><div class="ico">🎂</div><p><b>2. Prepara</b>Cópialo igualito</p></div>
        <div class="paso"><div class="ico">🪙</div><p><b>3. Cobra</b>Cuenta las monedas</p></div>
      </div>
      <button class="btn-grande" id="btn-jugar">¡Abrir la tienda!</button>
      <p class="atajo">¿Quieres ver todos los puestos ya?
        <button id="btn-todo">Empezar en el día 5</button></p>
    </div>
  </section>

  <!-- ============ JUEGO ============ -->
  <section id="s-juego" class="screen">
    <div class="barra">
      <div class="marcadores">
        <div class="chip dia">📅 Día <span id="m-dia">1</span></div>
        <div class="chip oro">🪙 <span id="m-oro">0</span></div>
        <div class="chip estrella">⭐ <span id="m-est">0</span></div>
      </div>
      <button class="btn-mus" id="btn-mus" aria-label="Música">🎵</button>
    </div>

    <div class="tablero">
      <div class="col-cliente">
        <div class="tarjeta">
          <p class="titulo">Tu cliente</p>
          <div class="escena">
            <div class="fila-cliente">
              <div class="cliente" id="cliente"></div>
              <div class="globo">
                <p class="quiero">quiero esto…</p>
                <div class="etiqueta" id="etiqueta"></div>
                <div id="pedido"></div>
                <div class="precio-cartel">🪙 <span id="m-precio">2</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-taller">
        <div class="tarjeta">
          <p class="titulo">Tu cocina</p>
          <div class="estaciones" id="estaciones"></div>
          <p class="pista" id="pista-est" style="margin:0 0 8px"></p>
          <div class="mesa">
            <div class="lienzo" id="lienzo"></div>
            <div class="controles" id="controles"></div>
          </div>
          <div class="acciones">
            <button class="btn sec" id="btn-limpiar">🧽 Empezar de nuevo</button>
            <button class="btn" id="btn-servir">✨ ¡Servir!</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ============ VENTANAS ============ -->
<div class="velo" id="velo"><div class="panel" id="panel"></div></div>
<div id="fx"></div>
<div id="toast"></div>

<script>
/* =======================================================
   1. SONIDO  ·  melodía original + efectos
   ======================================================= */
let actx=null, master=null, musGain=null, musicaOn=true, loopTimer=null, audioRoto=false;

const BPM=126, BEAT=60/BPM;
/* Melodía: 8 compases en Do mayor, alegre y saltarina */
const MELODIA=[
 [76,1],[79,1],[81,1],[79,1],   [76,1],[74,1],[72,2],
 [74,1],[77,1],[81,1],[79,1],   [77,1],[76,1],[74,2],
 [76,1],[79,1],[84,1],[83,1],   [81,1],[79,1],[76,2],
 [77,1],[76,1],[74,1],[77,1],   [76,1],[74,1],[72,2]
];
const BAJOS=[48,48,53,55,48,57,55,48];

function hz(m){return 440*Math.pow(2,(m-69)/12)}

function iniciaAudio(){
  if(actx||audioRoto) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){ audioRoto=true; return; }
  try{ actx=new AC(); }catch(e){ audioRoto=true; return; }
  master=actx.createGain(); master.gain.value=.28; master.connect(actx.destination);
  musGain=actx.createGain(); musGain.gain.value=musicaOn?1:0; musGain.connect(master);
  programaBucle();
}
function nota(f,t,dur,tipo,vol,dest){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=tipo; o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+dur+.05);
}
function programaBucle(){
  if(!actx) return;
  const t0=actx.currentTime+.1, largo=32*BEAT;
  let t=0;
  MELODIA.forEach(([n,d])=>{
    nota(hz(n),t0+t*BEAT,d*BEAT*.85,'triangle',.5,musGain);
    nota(hz(n+12),t0+t*BEAT,d*BEAT*.5,'sine',.12,musGain);
    t+=d;
  });
  BAJOS.forEach((r,c)=>{
    for(let i=0;i<4;i++) nota(hz(i%2?r+7:r),t0+(c*4+i)*BEAT,BEAT*.7,'sine',.42,musGain);
    [0.5,1.5,2.5,3.5].forEach((o,k)=> nota(hz(r+(k%2?19:24)),t0+(c*4+o)*BEAT,BEAT*.3,'triangle',.10,musGain));
  });
  loopTimer=setTimeout(programaBucle, largo*1000-120);
}
function ruido(t,dur,vol){
  const b=actx.createBuffer(1,actx.sampleRate*dur,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=actx.createBufferSource(); s.buffer=b;
  const g=actx.createGain(); g.gain.value=vol;
  const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
function sfx(tipo){
  if(!actx) return; const t=actx.currentTime;
  if(tipo==='toc') nota(760,t,.12,'triangle',.5);
  if(tipo==='pop'){nota(520,t,.1,'sine',.5); nota(880,t+.05,.12,'sine',.4);}
  if(tipo==='moneda'){nota(1046,t,.1,'square',.18); nota(1568,t+.06,.16,'square',.14);}
  if(tipo==='caja'){[784,988,1318].forEach((f,i)=>nota(f,t+i*.08,.3,'triangle',.4));}
  if(tipo==='bien'){[523,659,784,1046,1318].forEach((f,i)=>nota(f,t+i*.09,.5,'triangle',.42));}
  if(tipo==='ups'){nota(330,t,.18,'sawtooth',.2); nota(247,t+.12,.22,'sawtooth',.18);}
  if(tipo==='batir') ruido(t,.5,.16);
  if(tipo==='verter') ruido(t,.18,.07);
  if(tipo==='apretar'){ ruido(t,.09,.11); nota(300+Math.random()*140,t,.07,'square',.09); }
}

    d+=`</div>`;
    PTOP.forEach(([x,y])=> d+=`<div class="top" style="left:${x}px;bottom:${y}px">${t}</div>`);
  }
  if(it.tipo==='batido'){
    const f=pos(it.a,FRUTAS), c=pos(it.b,CREMAS).c, t=pos(it.c,ADORNOS).e;
    d+=`<div class="base-vaso"></div><div class="pajita"></div>`;
    d+=`<div class="vaso"><div class="liquido" style="background:${it.batido?f.c:'#F6EDE2'}">`;

        d+=`<div class="trozo" style="left:${x}px;bottom:${y}px;background:${f.c}"></div>`);
    d+=`</div><div class="brillo"></div></div>`;
    if(it.batido){
      d+=`<div class="nata" style="left:76px;bottom:140px;width:44px;height:36px;background:${c}"></div>`;
      d+=`<div class="nata" style="left:104px;bottom:146px;width:38px;height:32px;background:${c}"></div>`;
      d+=`<div class="nata" style="left:92px;bottom:160px;width:32px;height:28px;background:${c}"></div>`;
      d+=`<div class="top" style="left:96px;bottom:176px">${t}</div>`;
    }
  }
  if(it.tipo==='galleta'){
    const forma=it.a, g=pos(it.b,CREMAS).c, ch=pos(it.c,CHISPAS).c;
    const path={
      corazon:'M85 148 C 10 96, 14 34, 52 20 C 70 13, 85 30, 85 44 C 85 30, 100 13, 118 20 C 156 34, 160 96, 85 148 Z',
      estrella:'M85 12 L104 62 L158 64 L116 96 L131 148 L85 118 L39 148 L54 96 L12 64 L66 62 Z'
    };
    const forma1 = forma==='circulo'
      ? `<circle cx="85" cy="82" r="72" fill="#E8B979"/>`
      : `<path d="${path[forma]}" fill="#E8B979"/>`;
    const forma2 = forma==='circulo'
      ? `<circle cx="85" cy="82" r="55" fill="${g}"/>`

      const r=pos(id,RELLENOS);

        for(let i=0;i<n;i++) d+=`<div class="rebanada" style="left:${6+i*(150-an)/(n-1)}px;top:-${an/2-r.alto/2}px;

    if(it.listo) d+=`<div class="top" style="left:150px;bottom:172px">${t}</div>`;

    const s=pos(it.b,SIROPES).c, t=pos(it.c,ADORNOS).e;
    d+=`<div class="plato"></div>`;
    d+=`<div class="gofre" style="background:${TOSTADO[it.coccion||0]}"><div class="rejilla"></div></div>`;

  }
  return `<div class="caja ${tam}"><div class="escenario">${d}</div></div>`;
}

const $=(s)=>document.querySelector(s);

function pantalla(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  $('#'+id).classList.add('on');
}
function marcadores(){
  $('#m-dia').textContent=J.dia; $('#m-oro').textContent=J.oro;
  $('#m-est').textContent=J.estrellas; $('#m-precio').textContent=J.precio;
}

/* --------- generar pedido --------- */
function nuevoPedido(){
  let tipo=azar(dispo(ESTACIONES)).id;
  if(tipo===J.ultimoTipo) tipo=azar(dispo(ESTACIONES)).id;   // evita repetir dos veces seguidas
  J.ultimoTipo=tipo;
  const p={tipo};
  if(tipo==='tarta'){ p.a=azar(dispo(BIZCOCHOS)).id; p.b=azar(dispo(CREMAS)).id; p.c=azar(dispo(ADORNOS)).id; }
  if(tipo==='batido'){ p.a=azar(dispo(FRUTAS)).id; p.b=azar(dispo(CREMAS)).id; p.c=azar(dispo(ADORNOS)).id; p.batido=true; }
  if(tipo==='galleta'){ p.a=azar(FORMAS).id; p.b=azar(dispo(CREMAS)).id; p.c=azar(CHISPAS).id; }
  if(tipo==='hamburguesa'){
    const cuantos=Math.min(4, 2+Math.floor(J.dia/2)), lista=dispo(RELLENOS);
    p.pila=Array.from({length:cuantos},()=>azar(lista).id);
  }
  if(tipo==='cafe'){ p.a=azar(dispo(BEBIDAS)).id; p.c=azar(dispo(ENCIMA)).id;
    p.nivel=35+Math.floor(Math.random()*11)*5; }        // entre 35 y 85
  if(tipo==='gofre'){ p.b=azar(dispo(SIROPES)).id; p.c=azar(dispo(ADORNOS)).id; p.coccion=2; }
  if(tipo==='zumo'){ p.a=azar(ZUMOS).id; p.c=azar(dispo(ADORNOS)).id; p.llenado=100; p.listo=true; }
  return p;
}

function siguienteCliente(){
  if(J.cliente>=J.porDia){ finDeDia(); return; }
  J.cliente++;
  J.animal=azar(ANIMALES);
  J.pedido=nuevoPedido();
  J.precio=Math.min(5, 1+Math.ceil(J.dia/1.5)+Math.floor(Math.random()*2));
  J.obra=NUEVO[J.pedido.tipo]();       // empieza en la estación correcta
  if(J.obra.tipo==='cafe') J.obra.objetivo=J.pedido.nivel;
  $('#cliente').innerHTML=dibujaAnimal(J.animal);
  $('#cliente').className='cliente';
  void $('#cliente').offsetWidth;
  setTimeout(()=>$('#cliente').classList.add('idle'),520);
  const est=ESTACIONES.find(e=>e.id===J.pedido.tipo);
  $('#etiqueta').textContent=`${est.e} ${est.n}`;
  $('#pedido').innerHTML=dibuja(J.pedido,'sm');
  marcadores(); pintaTaller(); sfx('toc');
}

/* --------- taller --------- */
function pintaTaller(){
  limpiaTimers();
  const o=J.obra;
  $('#estaciones').innerHTML=ESTACIONES.map(e=>{
    const cerrado=e.dia&&e.dia>J.dia;
    return `<button class="est ${o.tipo===e.id?'sel':''} ${cerrado?'bloq':''}" data-est="${e.id}">
      <span class="e">${cerrado?'🔒':e.e}</span>${e.n}${cerrado?`<small>día ${e.dia}</small>`:''}</button>`;
  }).join('');
  $('#pista-est').textContent=PISTAS[o.tipo]||'';
  $('#lienzo').innerHTML=dibuja(o,'lg');

  let h='';
  const fila=(titulo,lista,clave,render)=>{
    h+=`<div class="grupo"><h4>${titulo}</h4><div class="ops">`;
    lista.forEach(x=> h+=`<button class="op ${o[clave]===x.id?'sel':''}" data-k="${clave}" data-v="${x.id}" style="${render(x)}">${x.e||''}</button>`);
    h+=`</div></div>`;
  };
  if(o.tipo==='tarta'){
    fila('Bizcocho', dispo(BIZCOCHOS), 'a', x=>`background:${x.c}`);
    fila('Crema',    dispo(CREMAS),    'b', x=>`background:${x.c}`);
    fila('Adornos',  dispo(ADORNOS),   'c', ()=>``);
  }
  if(o.tipo==='batido'){
    fila('Fruta',    dispo(FRUTAS),    'a', x=>`background:${x.c}`);
    fila('Nata',     dispo(CREMAS),    'b', x=>`background:${x.c}`);
    fila('Adornos',  dispo(ADORNOS),   'c', ()=>``);
    h+=`<button class="btn batidora" id="btn-batir" ${o.batido?'disabled':''}>🌀 ${o.batido?'¡Batido!':'¡Batir!'}</button>`;
  }
  if(o.tipo==='galleta'){
    fila('Forma',    FORMAS,           'a', ()=>``);
    fila('Glaseado', dispo(CREMAS),    'b', x=>`background:${x.c}`);
    fila('Chispas',  CHISPAS,          'c', ()=>``);
  }
  if(o.tipo==='hamburguesa'){
    h+=`<div class="grupo"><h4>Ingredientes (de abajo a arriba)</h4><div class="ops">`;
    dispo(RELLENOS).forEach(r=> h+=`<button class="op" data-ing="${r.id}" style="background:${r.c}">${r.e}</button>`);
    h+=`</div></div>`;
    h+=`<button class="btn sec" id="btn-quitar">↩️ Quitar el de arriba</button>`;
    h+=`<p class="pista">Toca los ingredientes en el mismo orden que pide el cliente</p>`;
  }
  if(o.tipo==='cafe'){
    fila('Bebida', dispo(BEBIDAS), 'a', x=>`background:${x.c};color:#fff`);
    h+=`<button class="btn batidora" id="btn-verter">🫖 Mantén pulsado para servir</button>
        <p class="pista">Para justo en la raya rosa 👉</p>`;
    fila('Por encima', dispo(ENCIMA), 'c', ()=>``);
  }
  if(o.tipo==='gofre'){
    if(!o.coccion){
      h+=`<div class="grupo"><h4>Plancha</h4>
        <div class="plancha"><b style="left:10px">crudo</b><b style="left:44%">¡ya!</b><b style="right:10px;color:#fff">quemado</b>
        <div class="marca" id="marca" style="left:0"></div></div>
        <button class="btn batidora" id="btn-sacar">🔥 ¡Sacar del molde!</button>
        <p class="pista">Para la barra en la zona dorada</p></div>`;
    } else {
      fila('Sirope', dispo(SIROPES), 'b', x=>`background:${x.c}`);
      fila('Fruta',  dispo(ADORNOS), 'c', ()=>``);
    }
  }
  if(o.tipo==='zumo'){
    fila('Fruta', ZUMOS, 'a', x=>`background:${x.c}`);
    h+=`<div class="grupo"><h4>Exprimidor</h4>
      <div class="medidor"><div class="relleno" id="relleno-zumo" style="width:${o.llenado}%"></div></div>
      <div class="medidor tiempo"><div class="relleno" id="tiempo-zumo" style="width:100%"></div></div>
      <button class="btn batidora" id="btn-exprimir" ${o.listo?'disabled':''}>
        ${o.listo?'🍹 ¡Zumo listo!':'🍋 ¡Aprieta rápido!'}</button>
      <p class="pista">Toca muchas veces seguidas antes de que se acabe el tiempo</p></div>`;
    fila('Decoración', dispo(ADORNOS), 'c', ()=>``);
  }
  $('#controles').innerHTML=h;
  conectaVerter(); conectaPlancha(); conectaZumo(); actualizaServir();
}

/* --------- ¿se puede servir ya? --------- */
function puedeServir(){
  const o=J.obra;
  if(o.tipo==='batido')      return o.batido;
  if(o.tipo==='hamburguesa') return o.pila.length>0;
  if(o.tipo==='cafe')        return o.nivel>5;
  if(o.tipo==='gofre')       return o.coccion>0;
  if(o.tipo==='zumo')        return o.listo;
  return true;
}
function actualizaServir(){ $('#btn-servir').disabled=!puedeServir(); }

/* --------- mecánica: servir café --------- */
let vertTimer=null, planchaTimer=null, tic=0;
function limpiaTimers(){ clearInterval(vertTimer); vertTimer=null; clearInterval(planchaTimer); planchaTimer=null;
  if(typeof zumoTimer!=='undefined'){ clearInterval(zumoTimer); zumoTimer=null; } }
function conectaVerter(){
  const b=$('#btn-verter'); if(!b) return;
  const parar=()=>{
    b.classList.remove('batiendo');
    const c=$('#lienzo .chorro'); if(c) c.remove();
    if(!vertTimer) return; clearInterval(vertTimer); vertTimer=null;
    sfx('toc'); refrescaObra(); actualizaServir();
  };
  const empezar=ev=>{
    ev.preventDefault(); if(vertTimer||J.obra.tipo!=='cafe') return; tic=0;
    b.classList.add('batiendo');
    const chorro=document.createElement('div');            // el café cayendo desde arriba
    chorro.className='chorro';
    chorro.style.background=`linear-gradient(180deg,transparent,${pos(J.obra.a,BEBIDAS).c})`;
    $('#lienzo .escenario').appendChild(chorro);
    vertTimer=setInterval(()=>{
      J.obra.nivel+=1.7; tic++;
      if(tic%5===0) sfx('verter');
      const l=$('#lienzo .liq-cafe');
      if(l){
        const alto=Math.min(J.obra.nivel,100)/100*116;
        l.style.height=alto+'px';
        if(alto>14 && !l.querySelector('.espuma')){
          const e=document.createElement('div'); e.className='espuma'; l.appendChild(e);
        }
      }
      if(J.obra.nivel>104){ parar(); J.obra.nivel=0;
        sfx('ups'); refrescaObra(); actualizaServir(); avisa('¡Se ha desbordado! Prueba otra vez 💧'); }
    },28);
  };
  b.addEventListener('pointerdown',empezar);
  b.addEventListener('touchstart',empezar,{passive:false});   // respaldo para móviles antiguos
  ['pointerup','pointerleave','pointercancel','touchend','touchcancel']
    .forEach(e=>b.addEventListener(e,parar));
}

/* --------- mecánica: exprimidor (pulsar rápido) --------- */
let zumoTimer=null;
function conectaZumo(){
  const b=$('#btn-exprimir'); if(!b) return;
  let tiempo=100;
  b.onclick=()=>{
    if(J.obra.listo) return;
    if(!zumoTimer){                                   // el primer toque arranca la cuenta atrás
      zumoTimer=setInterval(()=>{
        tiempo-=1.15;
        const bt=$('#tiempo-zumo'); if(bt) bt.style.width=Math.max(tiempo,0)+'%';
        if(tiempo<=0){ clearInterval(zumoTimer); zumoTimer=null; tiempo=100;
          J.obra.llenado=0; sfx('ups'); avisa('¡Se paró el exprimidor! Otra vez 🍋');
          refrescaObra(); pintaTaller(); }
      },40);
    }
    J.obra.llenado=Math.min(100,J.obra.llenado+7);
    sfx('apretar');
    const r=$('#relleno-zumo'); if(r) r.style.width=J.obra.llenado+'%';
    const l=$('#lienzo .liq-zumo');
    if(l) l.style.height=J.obra.llenado/100*140+'px';
    if(J.obra.llenado>=100){
      clearInterval(zumoTimer); zumoTimer=null;
      J.obra.listo=true; sfx('bien'); confeti(14); avisa('¡Zumo recién hecho! 🍹');
      refrescaObra(); pintaTaller();
    }
  };
}

/* --------- mecánica: plancha de gofres --------- */
function conectaPlancha(){
  const m=$('#marca'); if(!m) return;
  let p=0, dir=1;
  planchaTimer=setInterval(()=>{
    p+=dir*1.5; if(p>=97){p=97;dir=-1} if(p<=0){p=0;dir=1}
    m.style.left=p+'%';
  },24);
  $('#btn-sacar').onclick=()=>{
    clearInterval(planchaTimer); planchaTimer=null;
    const punto=parseFloat(m.style.left);
    J.obra.coccion = punto<35?1 : punto<65?2 : 3;
    if(J.obra.coccion===2){ sfx('bien'); confeti(12); avisa('¡Punto perfecto! 🧇'); }
    else if(J.obra.coccion===1){ sfx('pop'); avisa('Un poco blandito…'); }
    else { sfx('ups'); avisa('¡Uy, tostadito!'); }
    pintaTaller();
  };
}

function refrescaObra(){ $('#lienzo').innerHTML=dibuja(J.obra,'lg'); }

/* --------- servir --------- */
function servir(){
  limpiaTimers();
  const p=J.pedido, o=J.obra;
  let est=0;
  if(p.tipo===o.tipo){
    if(p.tipo==='hamburguesa'){
      const iguales=p.pila.filter((x,i)=>o.pila[i]===x).length;
      if(iguales===p.pila.length && o.pila.length===p.pila.length) est=3;
      else if(iguales>=p.pila.length-1) est=2;
      else if(iguales>=1) est=1;
    } else if(p.tipo==='cafe'){
      if(p.a===o.a) est++;
      if(Math.abs(p.nivel-o.nivel)<=8) est++;
      if(p.c===o.c) est++;
    } else if(p.tipo==='zumo'){
      if(o.listo) est++;
      if(p.a===o.a) est++;
      if(p.c===o.c) est++;
    } else if(p.tipo==='gofre'){
      if(o.coccion===2) est++;
      if(p.b===o.b) est++;
      if(p.c===o.c) est++;
    } else {
      if(p.a===o.a)est++; if(p.b===o.b)est++; if(p.c===o.c)est++;
    }
  }
  J.propina = est===3 ? 1 : 0;
  const frases=[
    {t:'¡Está riquísimo!', s:'No era lo que pedí… ¡pero me lo como igual!'},
    {t:'¡Mmm, gracias!',   s:'Casi casi como lo quería.'},
    {t:'¡Qué bueno!',      s:'¡Le has puesto mucho cariño!'},
    {t:'¡PERFECTO!',       s:'¡Es justo justo lo que quería!'}
  ][est];
  J.estrellas+=est; J.estrellasDia+=est;
  if(est===3){ confeti(28); sfx('bien'); } else sfx('pop');
  marcadores();
  panel(`
    <div style="width:110px;margin:0 auto">${dibujaAnimal(J.animal)}</div>
    <div class="estrellas">${[0,1,2].map(i=>
      `<span class="${i<est?'':'apagada'}" style="animation-delay:${i*.14}s">⭐</span>`).join('')}</div>
    <h2>${frases.t}</h2><p>${frases.s}</p>
    <button class="btn" id="btn-cobrar">🪙 Cobrar</button>`);
  $('#btn-cobrar').onclick=cobrar;
}

/* --------- cobrar --------- */
function cobrar(){
  const precio=J.precio, mixto=J.dia>=3;
  let total=0; const puestas=[];          // pila de monedas metidas, para poder sacarlas

  const botonera=`<button class="btn sec" id="btn-deshacer" style="margin-top:10px">
      ↩️ Sacar la última moneda</button>`;

  if(!mixto){                                    /* días 1-2: todas valen 1 */
    panel(`
      <h2>A cobrar</h2><p>Pon ${precio} moneda${precio>1?'s':''} en la caja</p>
      <div class="huecos">${Array.from({length:precio},()=>`<div class="hueco"></div>`).join('')}</div>
      <div style="font-size:40px">💰</div>
      <div class="monton">${Array.from({length:precio+3},()=>
        `<button class="moneda" data-v="1">🪙</button>`).join('')}</div>
      ${botonera}`);
  } else {                                       /* día 3+: monedas de 1 y de 2 */
    const bolsa=mezcla([1,2,1,2,1,2,1]);
    panel(`
      <h2>A cobrar</h2><p>Junta exactamente ${precio} monedas</p>
      <div class="contador">🪙 <b id="suma">0</b> de ${precio}</div>
      <div class="monton">${bolsa.map(v=>
        `<button class="moneda ${v===2?'dos':''}" data-v="${v}">${v}</button>`).join('')}</div>
      <p class="pista">Las grandes valen 2 y las pequeñas valen 1</p>
      ${botonera}`);
  }

  const pinta=()=>{
    if(mixto){ $('#suma').textContent=total; }
    else{
      $('#panel').querySelectorAll('.hueco').forEach((hu,i)=>{
        hu.classList.toggle('lleno', i<total);
        hu.textContent = i<total ? '🪙' : '';
      });
    }
    $('#btn-deshacer').disabled = puestas.length===0;
  };
  pinta();

  $('#panel').onclick=(ev)=>{
    if(ev.target.closest('#btn-deshacer')){            /* rectificar */
      const m=puestas.pop(); if(!m) return;
      m.classList.remove('ida'); total-=+m.dataset.v;
      sfx('toc'); pinta(); return;
    }
    const m=ev.target.closest('.moneda'); if(!m) return;
    const v=+m.dataset.v;
    if(total+v>precio){
      rechaza(m);
      avisa(v===2 ? 'Con esa te pasarías, prueba una pequeña' : '¡Ya está completo!');
      return;
    }
    m.classList.add('ida'); puestas.push(m); total+=v; sfx('moneda'); pinta();
    if(total===precio) cajaCerrada(precio);
  };
}
function mezcla(a){ return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]); }
function rechaza(m){ m.classList.add('no'); sfx('ups'); setTimeout(()=>m.classList.remove('no'),320); }
function cajaCerrada(precio){
  J.oro+=precio+J.propina; marcadores(); sfx('caja'); confeti(16);
  setTimeout(()=>{
    panel(`<div style="font-size:64px">🧾</div><h2>¡Caja cerrada!</h2>
           <p>Has ganado ${precio} monedas${J.propina?'<br>💖 +1 de propina por el trabajo perfecto':''}</p>
           <button class="btn" id="btn-sig">➡️ Siguiente cliente</button>`);
    $('#btn-sig').onclick=()=>{cierraPanel(); siguienteCliente();};
  },700);
}

/* --------- fin del día --------- */
const REGALOS={
 1:'🍔 ¡Mañana abre el puesto de HAMBURGUESAS!<br>Habrá que apilar los ingredientes en orden',
 2:'☕ ¡Llega la CAFETERA!<br>Y en la caja aparecen 🪙 monedas de 2<br>🫐 arándanos y crema cielo',
 3:'🧇 ¡Se enciende la PLANCHA DE GOFRES!<br>🌸 flores y bizcocho de limón',
 4:'🍹 ¡Abre el EXPRIMIDOR de zumos!<br>🥒 pepinillos y 🌿 batido de menta',
 5:'🍳 huevo, ⭐ estrellas, 🍓 café de fresa y 🍬 caramelos'
};
function finDeDia(){
  const regalo=REGALOS[J.dia];
  sfx('bien'); confeti(40);
  panel(`<div style="font-size:60px">🌙</div>
    <h2>¡Fin del día ${J.dia}!</h2>
    <p>⭐ ${J.estrellasDia} estrellas · 🪙 ${J.oro} monedas en total</p>
    ${regalo?`<p style="color:var(--fresa-fuerte)">Mañana en la pastelería:<br>${regalo}</p>`:''}
    <button class="btn" id="btn-dia">☀️ Abrir el día ${J.dia+1}</button>`);
  $('#btn-dia').onclick=()=>{
    J.dia++; J.cliente=0; J.estrellasDia=0; J.porDia=Math.min(5,2+J.dia);
    cierraPanel(); siguienteCliente();
  };
}

/* --------- ventanas y confeti --------- */
let toastTimer=null;
function avisa(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1700);
}
function panel(html){ $('#panel').innerHTML=html; $('#velo').classList.add('on'); }
function cierraPanel(){ $('#velo').classList.remove('on'); $('#panel').onclick=null; }
function confeti(n){
  const cols=['#FF9EBB','#FFDD8F','#93E0C4','#BDB2F2','#FFF','#F2678F'];
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.cssText=`left:${Math.random()*100}vw;top:-24px;background:${cols[i%cols.length]};
      animation-duration:${1.1+Math.random()*1.1}s;animation-delay:${Math.random()*.35}s;
      border-radius:${Math.random()>.5?'50%':'3px'}`;
    $('#fx').appendChild(c); setTimeout(()=>c.remove(),2600);
  }
}

/* =======================================================
   5. INTERACCIÓN
   ======================================================= */
$('#btn-jugar').onclick=()=>{
  iniciaAudio(); if(actx&&actx.state==='suspended') actx.resume();
  pantalla('s-juego'); J.cliente=0; siguienteCliente();
};

$('#btn-todo').onclick=()=>{
  iniciaAudio(); if(actx&&actx.state==='suspended') actx.resume();
  J.dia=5; J.porDia=5; pantalla('s-juego'); J.cliente=0; siguienteCliente();
  avisa('Los 6 puestos están abiertos 🎉');
};

$('#btn-mus').onclick=()=>{
  iniciaAudio(); musicaOn=!musicaOn;
  if(actx) musGain.gain.linearRampToValueAtTime(musicaOn?1:0, actx.currentTime+.2);
  $('#btn-mus').textContent=musicaOn?'🎵':'🔇';
  $('#btn-mus').classList.toggle('off',!musicaOn);
};

$('#estaciones').onclick=(e)=>{
  const b=e.target.closest('[data-est]'); if(!b) return;
  J.obra=NUEVO[b.dataset.est](); sfx('toc'); pintaTaller();
};

$('#controles').onclick=(e)=>{
  const ing=e.target.closest('[data-ing]');
  if(ing){
    if(J.obra.pila.length>=5){ avisa('¡La torre ya está muy alta!'); sfx('ups'); return; }
    J.obra.pila.push(ing.dataset.ing); sfx('pop'); refrescaObra(); actualizaServir(); return;
  }
  if(e.target.closest('#btn-quitar')){
    if(!J.obra.pila.length) return;
    J.obra.pila.pop(); sfx('toc'); refrescaObra(); actualizaServir(); return;
  }
  const b=e.target.closest('.op');
  if(b){ J.obra[b.dataset.k]=b.dataset.v; sfx('pop');
    b.parentNode.querySelectorAll('.op').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); refrescaObra(); return; }
  if(e.target.closest('#btn-batir')){
    const btn=$('#btn-batir'), vaso=$('#lienzo .caja');
    btn.disabled=true; vaso.classList.add('batiendo'); sfx('batir');
    setTimeout(()=>{ vaso.classList.remove('batiendo'); J.obra.batido=true;
      sfx('pop'); confeti(10); pintaTaller(); },900);
  }
};

$('#btn-limpiar').onclick=()=>{ J.obra=NUEVO[J.obra.tipo](); sfx('toc'); pintaTaller(); };
$('#btn-servir').onclick=servir;
</script>
